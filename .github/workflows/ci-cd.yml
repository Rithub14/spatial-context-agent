# Required GitHub Secrets:
#   AZURE_CREDENTIALS      — Service principal JSON (az ad sp create-for-rbac output)
#   ACR_LOGIN_SERVER       — e.g. spatialagentacr.azurecr.io
#   ACR_USERNAME           — ACR admin username
#   ACR_PASSWORD           — ACR admin password
#   ACI_RESOURCE_GROUP     — Azure resource group name
#   ACI_NAME               — Container instance name (e.g. spatial-agent-rg-api)
#   DB_CONNECTION_STRING   — Full PostgreSQL connection URL for the deployed instance
#   API_KEY                — API key injected into the container

name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  IMAGE_NAME: spatial-agent

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint + Test — runs on every push and PR
  # ---------------------------------------------------------------------------
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spatial_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spatial_agent_test
      CLIP_MODEL_NAME: ViT-B/32
      DEVICE: cpu
      ENABLE_AUTH: "false"
      ENABLE_RATE_LIMIT: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=term-missing tests/

  # ---------------------------------------------------------------------------
  # Job 2: Build & push Docker image — only on merge to main
  # ---------------------------------------------------------------------------
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ---------------------------------------------------------------------------
  # Job 3: Deploy to Azure Container Instance + smoke test
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Instance
        uses: azure/aci-deploy@v1
        with:
          resource-group: ${{ secrets.ACI_RESOURCE_GROUP }}
          dns-name-label: spatial-agent
          image: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          registry-login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          registry-username: ${{ secrets.ACR_USERNAME }}
          registry-password: ${{ secrets.ACR_PASSWORD }}
          name: ${{ secrets.ACI_NAME }}
          location: westeurope
          ports: 8000
          environment-variables: >
            CLIP_MODEL_NAME=ViT-B/32
            DEVICE=cpu
            API_HOST=0.0.0.0
            API_PORT=8000
            ENABLE_AUTH=true
            ENABLE_RATE_LIMIT=true
          secure-environment-variables: >
            DATABASE_URL=${{ secrets.DB_CONNECTION_STRING }}
            API_KEY=${{ secrets.API_KEY }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install smoke test dependencies
        run: pip install httpx

      - name: Wait for container to be ready
        run: sleep 30

      - name: Run smoke test
        run: |
          python scripts/smoke_test.py \
            --url "http://spatial-agent.${{ secrets.ACI_RESOURCE_GROUP }}.westeurope.azurecontainer.io:8000" \
            --api-key "${{ secrets.API_KEY }}"
