services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spatial_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/spatial_agent
      CLIP_MODEL_NAME: ViT-B/32
      DEVICE: cpu
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      ENABLE_AUTH: "false"
      ENABLE_RATE_LIMIT: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
